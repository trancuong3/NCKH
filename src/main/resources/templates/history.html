<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Hoạt Động</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calendar-table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
        }
        .calendar-table th, .calendar-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }
        .calendar-table th {
            background-color: #f4f4f4;
        }
        .task-item {
            background-color: #dfffd6;
            border: 1px solid #8fc98b;
            border-radius: 5px;
            padding: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Task History</a>
    </div>
</nav>

<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center">
        <form method="get" action="/history">
            <input type="hidden" name="startDate" th:value="${previousStartDate}">
            <button type="submit" class="btn btn-outline-success">Tuần Trước</button>
        </form>
        <h1 class="text-center mb-0">Lịch Sử Hoạt Động</h1>
        <form method="get" action="/history">
            <input type="hidden" name="startDate" th:value="${nextStartDate}">
            <button type="submit" class="btn btn-outline-success">Tuần Tiếp Theo</button>
        </form>
    </div>
</div>

<div class="container py-5">
    <div class="table-responsive">
        <table class="calendar-table">
            <thead>
            <tr>
                <th>Thời Gian / Ngày</th>
                <th th:each="day, iterStat : ${weekDays}">
                    <span th:text="${day}"></span><br>
                    <span th:text="${weekDates[iterStat.index]}"></span>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="timeSlot : ${timeSlots}">
                <td th:text="${timeSlot}"></td>
                <td th:each="day, iterStat : ${weekDays}">
                    <div th:each="task : ${tasksByDay[day]}" th:if="${task.performTime == timeSlot}" class="task-item">
                        <span th:text="${task.taskType} + ' (' + ${task.status} + ')'"></span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="text-center py-3 bg-success text-white">
    <p>&copy; 2024 Task History. Bảo lưu mọi quyền.</p>
</footer>
</body>
</html>
