<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Hoạt Động</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calendar-table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
        }
        .calendar-table th, .calendar-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }
        .calendar-table th {
            background-color: #f4f4f4;
        }
        .task-item {
            background-color: #dfffd6;
            border: 1px solid #8fc98b;
            border-radius: 5px;
            padding: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Task History</a>
    </div>
</nav>

<div class="container py-5">
    <h1 class="text-center mb-4">Lịch Sử Hoạt Động</h1>
    <div class="table-responsive">
        <table class="calendar-table">
            <thead>
            <tr>
                <th>Thời Gian / Ngày</th>
                <th>Thứ 2</th>
                <th>Thứ 3</th>
                <th>Thứ 4</th>
                <th>Thứ 5</th>
                <th>Thứ 6</th>
                <th>Thứ 7</th>
                <th>Chủ Nhật</th>
            </tr>
            </thead>
            <tbody id="calendar-body">
            <!-- Rows will be generated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<footer class="text-center py-3 bg-success text-white">
    <p>&copy; 2024 Task History. Bảo lưu mọi quyền.</p>
</footer>

<script>
    const timeSlots = ["07:00", "09:00", "13:00", "15:00", "17:00"]; // Define time slots
    const daysOfWeek = ["2024-11-1", "2024-11-2", "2024-11-3", "2024-11-4", "2024-11-5", "2024-11-6", "2024-11-"]; // Week dates

    async function fetchTasks(startDate = null, endDate = null) {
        try {
            const url = new URL("/history/api/tasks", window.location.origin);
            if (startDate && endDate) {
                url.searchParams.append("startDate", startDate);
                url.searchParams.append("endDate", endDate);
            }

            const response = await fetch(url);
            if (!response.ok) {
                throw new Error("Failed to fetch tasks");
            }
            return await response.json();
        } catch (error) {
            console.error(error);
            return [];
        }
    }

    function renderCalendar(tasks) {
        const calendarBody = document.getElementById("calendar-body");
        calendarBody.innerHTML = ""; // Clear previous content

        // Create rows for each time slot
        timeSlots.forEach(timeSlot => {
            const row = document.createElement("tr");

            // Add the time slot column
            const timeCell = document.createElement("td");
            timeCell.textContent = timeSlot;
            row.appendChild(timeCell);

            // Add columns for each day of the week
            daysOfWeek.forEach(date => {
                const dayCell = document.createElement("td");

                // Filter tasks for this date and time
                const tasksForSlot = tasks.filter(task => {
                    const taskDate = new Date(task.performedDate).toISOString().split("T")[0];
                    return taskDate === date && task.performTime === timeSlot;
                });

                // Add task items to the cell
                tasksForSlot.forEach(task => {
                    const taskDiv = document.createElement("div");
                    taskDiv.className = "task-item";
                    taskDiv.textContent = `${task.taskType} (${task.status})`;
                    dayCell.appendChild(taskDiv);
                });

                row.appendChild(dayCell);
            });

            calendarBody.appendChild(row);
        });
    }

    async function loadCalendar() {
        const tasks = await fetchTasks(); // Optionally pass startDate and endDate
        renderCalendar(tasks);
    }

    // Call the function to render the calendar on page load
    loadCalendar();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
