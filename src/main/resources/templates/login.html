<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/images/leaf.png}" rel="icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Đăng Nhập</title>
    <link th:href="@{/css/general.css}" rel="stylesheet">
    <link th:href="@{/css/sign_in.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar">
    <a class="navbar__brand" href="#">Famer</a>
    <img th:src="@{/images/menu.png}" class="navbar__menu">
    <ul class="navbar__navl">
        <li class="navbar__item">
            <a class="navbar__link" href="#">Trang Chủ</a>
        </li>
        <li class="navbar__item">
            <a class="navbar__link" href="#advice-section">Lời Khuyên</a>
        </li>
        <li class="navbar__item">
            <a class="navbar__link" href="#weather-section">Thời Tiết</a>
        </li>
        <li class="navbar__item">
            <a class="navbar__link" href="#position-section">Vị trí</a>
        </li>
    </ul>

    <ul class="navbar__navr">
        <li class="navbar__item">
            <a class="navbar__link" href="#">Đăng Ký</a>
        </li>
        <li class="navbar__item">
            <a class="navbar__link active" aria-current="page" href="#">Đăng Nhập</a>
        </li>
    </ul>
</nav>

<main>
    <section class="sign">
        <h1 class="sign__title">Đăng Nhập</h1>
        <div>
            <img class="img__farmer" th:src="@{/images/planting.png}">
        </div>
        <form class="sign__form" th:action="@{/login}" method="POST" id="loginForm">
            <div class="sign__form-group">
                <label class="sign__label" for="username">Tên đăng nhập</label><br>
                <input class="sign__input" type="text" id="username" name="username" required>
            </div>
            <div class="sign__form-group">
                <label class="sign__label" for="password">Mật khẩu</label><br>
                <input class="sign__input" type="password" id="password" name="password" required>
            </div>
        </form>
        <div>
            <a class="sign__forgot" href="#">Quên mật khẩu?</a>
        </div>
        <div class="but">
            <button class="sign__submit" type="submit" id="submitLogin">Đăng Nhập</button>
            <button class="sign__submit" type="button" onclick="window.location.href='/signup'">Đăng Ký</button>

        </div>
    </section>
</main>

<footer></footer>
<script th:src="@{/js/sign.js}"></script>
</body>
</html>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const loginButton = document.getElementById("submitLogin");
        const loginForm = document.getElementById("loginForm");

        loginButton.addEventListener("click", (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (!username || !password) {
                alert("Vui lòng điền đầy đủ tên đăng nhập và mật khẩu.");
                return;
            }

            const data = { username, password };

            fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
                .then(res => {
                    if (res.ok) {
                        return res.json();
                    } else {
                        throw new Error("Đăng nhập không thành công, vui lòng kiểm tra lại thông tin.");
                    }
                })
                .then(response => {
                    if (response.success) {
                        alert("Đăng nhập thành công!");
                        window.location.href = "/home";
                    } else {
                        alert("Đăng nhập không thành công, vui lòng kiểm tra lại thông tin.");
                    }
                })
                    .catch(error => console.error("Error:", error));
        });
    });
</script>
