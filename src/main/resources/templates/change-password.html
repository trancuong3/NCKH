<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Change Password</title>
</head>
<body>
<h1>Change Password</h1>
<form th:action="@{/change-password}" method="post" th:object="${changePasswordRequest}">
    <div>
        <label for="oldPassword">Current Password:</label>
        <input type="password" id="oldPassword" th:field="*{oldPassword}" required>
        <p th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></p>
    </div>
    <div>
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" required>
        <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
    </div>
    <div>
        <label for="confirmPassword">Confirm New Password:</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
    </div>
    <button type="submit">Change Password</button>
</form>
<div th:if="${error}">
    <p style="color:red;" th:text="${error}"></p>
</div>
<div th:if="${success}">
    <p style="color:green;" th:text="${success}"></p>
</div>
</body>
</html>
